# 认证服务 auth‑service 应用配置

# 服务端口，环境变量 AUTH_SERVICE_PORT，默认8081
server:
  port: ${AUTH_SERVICE_PORT:8081}

spring:
  application:
    # 服务名称，用于注册中心、日志、Ping探活接口
    name: auth-service
  # MySQL连接配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:agent_doc_workbench}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=2000&socketTimeout=5000
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
      maximum-pool-size: 10
  # Redis连接配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 1s
      timeout: 2s
  # flyway数据库版本迁移配置
  flyway:
    enabled: true
    # SQL脚本存放路径，版本化sql放置在 resources/db/migration 下
    locations: classpath:db/migration
    # 非空库自动执行baseline基线初始化，适配已有数据库的项目
    baseline-on-migrate: true
  # Jackson JSON序列化全局时区，统一东八区，解决日期时间序列化时差问题
  jackson:
    time-zone: Asia/Shanghai

# Auth JWT认证配置
auth:
  identity:
    # local必须配置持久身份密钥，且不得与下方Capability密钥相同；缺失时拒绝启动。
    private-key: ${LOCAL_IDENTITY_PRIVATE_KEY:}
    public-key: ${LOCAL_IDENTITY_PUBLIC_KEY:}
    trusted-encrypted-network: ${LOCAL_IDENTITY_TRUSTED_ENCRYPTED_NETWORK:false}
    clients:
      workbench-web:
        purpose: BFF
        secret: ${LOCAL_BFF_CLIENT_SECRET:}
      task-service:
        purpose: SERVICE
        secret: ${LOCAL_TASK_CLIENT_SECRET:}
  jwt:
    # RSA私钥，环境变量 JWT_PRIVATE_KEY；生产环境填入PEM格式密钥；为空则启动自动生成临时密钥（仅开发调试使用）
    private-key: ${JWT_PRIVATE_KEY:}
    # RSA公钥，环境变量 JWT_PUBLIC_KEY；生产环境填入PEM公钥，用于校验token签名
    public-key: ${JWT_PUBLIC_KEY:}
    # JWT签发者标识，写入token payload iss字段
    issuer: agent-doc-workbench

# 自定义openapi配置
agent-doc:
  task-internal-auth:
    # P0签发入口仅接受独立Task服务凭据；为空/过短时拒绝签发，不回退用户Token。
    secret: ${TASK_INTERNAL_AUTH_SECRET:}
    trusted-encrypted-network: ${TASK_INTERNAL_TRUSTED_ENCRYPTED_NETWORK:false}
  security:
    # TLS 在可信加密内部网络外终止时须显式确认；不是来源 IP 授权。
    task-recovery-trusted-encrypted-network: ${TASK_RECOVERY_TRUSTED_ENCRYPTED_NETWORK:false}
  task-recovery:
    # 空密钥默认禁用；当前与旧密钥仅由环境变量提供，轮换重叠最长 5 分钟。
    machine-key: ${TASK_RECOVERY_MACHINE_KEY:}
    previous-machine-key: ${TASK_RECOVERY_PREVIOUS_MACHINE_KEY:}
    key-rotated-at: ${TASK_RECOVERY_KEY_ROTATED_AT:}
  openapi:
    title: Auth Service API
    description: 认证服务：受控身份签发、当前用户与JWKS

# Spring Boot Actuator 健康检查端点配置
management:
  health:
    # 认证就绪指标按模式检查Redis，OIDC不因无Redis而退出就绪。
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        # 对外暴露健康、信息端点，供k8s/gateway做服务探活
        include: health,info
  endpoint:
    health:
      # 健康接口不返回详细组件详情，只返回UP/DOWN，保护内部信息
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,authenticationReadiness
        liveness:
          include: livenessState

# SpringDoc OpenAPI Swagger文档路径配置
springdoc:
  swagger-ui:
    # Swagger UI访问页面路径
    path: /swagger-ui.html
  api-docs:
    # OpenAPI JSON元数据接口路径
    path: /v3/api-docs

# 日志配置
logging:
  level:
    root: INFO
    com.agentdoc.auth: DEBUG
    # 用户查询/写入包含密码哈希；禁止MyBatis调试日志输出绑定参数与结果。
    com.agentdoc.auth.mapper: INFO
    org.springframework: INFO
    org.springframework.ai: INFO

# SQL日志打印
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
