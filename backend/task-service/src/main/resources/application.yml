# 任务服务 task‑service 应用配置

# 服务端口，环境变量 TASK_SERVICE_PORT，默认8083
server:
  port: ${TASK_SERVICE_PORT:8083}

spring:
  application:
    # 服务名称，用于注册中心、日志、Ping探活接口
    name: task-service
  # MySQL连接配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:agent_doc_workbench}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        default-requeue-rejected: false
  # Jackson JSON序列化全局时区，统一东八区，解决日期时间序列化时差问题
  jackson:
    time-zone: Asia/Shanghai
  cloud:
    openfeign:
      client:
        config:
          # 针对feign客户端名称为 auth-identity-self 的单独配置（按服务名粒度）
          auth-identity-self:
            # 建立连接的超时时间，单位毫秒：2000ms（2s）
            connectTimeout: 2000
            # 读取响应数据超时时间，单位毫秒：5000ms（5s）
            # 注意：这不是接口总超时，是连接成功后，等待服务返回数据流的超时
            readTimeout: 5000
            # 是否允许HTTP重定向（301/302自动跳转），false=禁止自动跟随重定向
            followRedirects: false
            # Feign日志打印级别：none=不输出任何feign请求日志
            # 可选值：NONE（无）、BASIC（请求方法+URL+响应码+耗时）、HEADERS（BASIC+请求头响应头）、FULL（全部：头+体+元数据）
            loggerLevel: none
            # 自定义异常解码器，指定全限定类名
            # Feign调用非2xx响应码时，不再抛出默认FeignException，交由这个自定义类解析返回体，转换成业务异常
            errorDecoder: com.agentdoc.common.feign.config.IdentitySelfFeignErrorDecoder
          # P0内部凭据只能发往原始目标，不跟随重定向，不记录认证头。
          auth-service:
            connectTimeout: 2000
            readTimeout: 5000
            followRedirects: false
            loggerLevel: none
          agent-service:
            connectTimeout: 2000
            readTimeout: 5000
            followRedirects: false
            loggerLevel: none
          # 专用直连客户端不打印凭证/证明，超时受整轮 45 秒预算约束。
          task-recovery-auth:
            connectTimeout: 2000
            readTimeout: 5000
            loggerLevel: none
          task-recovery-document:
            connectTimeout: 2000
            readTimeout: 5000
            loggerLevel: none
  ai:
    mcp:
      server:
        name: agent-doc-workbench
        version: 0.2.0
        protocol: STREAMABLE

# 自定义openapi配置
agent-doc:
  task-internal-auth:
    # 服务间内部调用的签名密钥，用于校验内部请求的合法性
    secret: ${TASK_INTERNAL_AUTH_SECRET:}
    # 内部鉴权时，Auth服务直连地址（任务恢复/内部通路专用）
    auth-url: ${TASK_INTERNAL_AUTH_URL:http://localhost:8081}
    # 内部鉴权时，Agent服务直连地址（任务恢复/内部通路专用）
    agent-url: ${TASK_INTERNAL_AGENT_URL:http://localhost:8084}
    # 是否信任底层加密内网链路开关
    trusted-encrypted-network: ${TASK_INTERNAL_TRUSTED_ENCRYPTED_NETWORK:false}
  task-trace:
    # Jaeger 内部只读查询根地址；空值禁用，不能配置凭证或用户输入 URL
    query-url: ${JAEGER_QUERY_URL:}
  task-recovery:
    enabled: ${TASK_RECOVERY_ENABLED:false}
    machine-key: ${TASK_RECOVERY_MACHINE_KEY:}
    auth-url: ${TASK_RECOVERY_AUTH_URL:http://localhost:8081}
    agent-url: ${TASK_RECOVERY_AGENT_URL:http://localhost:8084}
    document-url: ${TASK_RECOVERY_DOCUMENT_URL:http://localhost:8082}
    trusted-encrypted-network: ${TASK_RECOVERY_TRUSTED_ENCRYPTED_NETWORK:false}
  replay:
    # 紧急回滚时关闭，仅阻止新Replay创建
    creation-enabled: ${REPLAY_CREATION_ENABLED:true}
  security:
    # Base64 编码的 16/24/32 字节 AES 密钥，生产环境必须通过环境变量注入
    task-capability-key: ${TASK_CAPABILITY_KEY:}
    # 模型 B：从 auth-service JWK Set 拉取 RSA 公钥，供 Spring Security Resource Server
    # 从 Authorization 自行解析 JWT 身份（配置即启用；无效 token 由 Security 层直接 401）
    jwks-url: ${AUTH_JWKS_URL:http://localhost:8081/oauth2/jwks}
    task-capability-filter-enabled: true
    capability-auth-endpoints:
      - /mcp
      - /mcp/**
      - /a2a
      - /a2a/**
  openapi:
    title: Task Service API
    description: 任务服务：Agent 任务、变更审批、Token 用量与审计
  feign:
    # 普通用户契约仍经网关；Task签发/执行档案由专用拦截分支改为受限直连。
    gateway-url: ${GATEWAY_URL:http://localhost:9090}
  a2a:
    agent-service-url: ${AGENT_SERVICE_URL:http://localhost:8084}
    task-callback-url: ${TASK_CALLBACK_URL:http://localhost:8083/api/task/internal/a2a/events}
    mcp-server-url: ${MCP_SERVER_URL:http://localhost:8083/mcp}
    paths:
      send: /a2a/message:send
      task: /a2a/tasks/{taskId}
      cancel: /a2a/tasks/{taskId}:cancel
    reconcile-delay-ms: ${A2A_RECONCILE_DELAY_MS:60000}
    reconcile-stale-seconds: ${A2A_RECONCILE_STALE_SECONDS:120}
    reconcile-batch-size: ${A2A_RECONCILE_BATCH_SIZE:50}

# Spring Boot Actuator 健康检查端点配置
management:
  endpoints:
    web:
      exposure:
        # 对外暴露健康、信息端点，供k8s/gateway做服务探活
        include: health,info
  endpoint:
    health:
      # 健康接口不返回详细组件详情，只返回UP/DOWN，保护内部信息
      show-details: never

# SpringDoc OpenAPI Swagger文档路径配置
springdoc:
  swagger-ui:
    # Swagger UI访问页面路径
    path: /swagger-ui.html
  api-docs:
    # OpenAPI JSON元数据接口路径
    path: /v3/api-docs

# 日志配置
logging:
  level:
    root: INFO
    com.agentdoc.task: DEBUG
    org.springframework: INFO
    org.springframework.ai: INFO

# SQL日志打印
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
