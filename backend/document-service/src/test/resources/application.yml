spring:
  datasource:
    url: jdbc:h2:mem:document_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

# 测试环境启用 Security Resource Server（与生产一致；仅构造 JwtDecoder 不联网拉取）
agent-doc:
  security:
    jwks-url: http://localhost:8081/oauth2/jwks

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
