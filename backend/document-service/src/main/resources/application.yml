# 文档服务 document‑service 应用配置

# 服务端口，环境变量 DOCUMENT_SERVICE_PORT，默认8082
server:
  port: ${DOCUMENT_SERVICE_PORT:8082}

spring:
  application:
    # 服务名称，用于注册中心、日志、Ping探活接口
    name: document-service
  # MySQL连接配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:agent_doc_workbench}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  # Redis连接配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  # Jackson JSON序列化全局时区，统一东八区，解决日期时间序列化时差问题
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 自定义openapi配置
agent-doc:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:agent-doc}
    auto-create-bucket: ${MINIO_AUTO_CREATE_BUCKET:true}
  openapi:
    title: Document Service API
    description: 文档服务：空间、成员、文档树、版本快照
  security:
    jwks-url: ${AUTH_JWKS_URL:http://localhost:8081/oauth2/jwks}
    task-capability-filter-enabled: true

# Spring Boot Actuator 健康检查端点配置
management:
  endpoints:
    web:
      exposure:
        # 对外暴露健康、信息端点，供k8s/gateway做服务探活
        include: health,info
  endpoint:
    health:
      # 健康接口不返回详细组件详情，只返回UP/DOWN，保护内部信息
      show-details: never

# SpringDoc OpenAPI Swagger文档路径配置
springdoc:
  swagger-ui:
    # Swagger UI访问页面路径
    path: /swagger-ui.html
  api-docs:
    # OpenAPI JSON元数据接口路径
    path: /v3/api-docs

# 日志配置
logging:
  level:
    root: INFO
    com.agentdoc.document: DEBUG
    org.springframework: INFO
    org.springframework.ai: INFO

# SQL日志打印
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
