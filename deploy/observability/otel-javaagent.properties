# OpenTelemetry Java Agent 本地开发默认配置。
# 系统属性和 OTEL_* 环境变量的优先级高于本文件，可在特殊场景按需覆盖。
otel.exporter.otlp.endpoint=http://127.0.0.1:4317
otel.exporter.otlp.protocol=grpc
otel.traces.exporter=otlp
otel.metrics.exporter=none
otel.logs.exporter=none
otel.propagators=tracecontext,baggage
otel.traces.sampler=parentbased_always_on
otel.bsp.schedule.delay=1000
otel.bsp.export.timeout=30000
otel.bsp.max.queue.size=2048
otel.instrumentation.common.db.query-sanitization.enabled=true
otel.instrumentation.genai.capture-message-content=false
otel.instrumentation.spring-ai.capture-message-content=false
otel.resource.attributes=deployment.environment.name=local
