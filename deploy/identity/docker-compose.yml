name: adw-identity-p0

services:
  postgres:
    image: postgres:17.11-alpine3.24@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run Initialize-LocalEnv.ps1 first}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run Initialize-LocalEnv.ps1 first}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/010-keycloak.sh:/docker-entrypoint-initdb.d/010-keycloak.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run Initialize-LocalEnv.ps1 first}
      KC_DB_POOL_INITIAL_SIZE: "1"
      KC_DB_POOL_MIN_SIZE: "1"
      KC_DB_POOL_MAX_SIZE: "10"
      KC_CACHE: local
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:18090}
      KC_HOSTNAME_STRICT: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-p0-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run Initialize-LocalEnv.ps1 first}
      KEYCLOAK_POC_BFF_URL: ${KEYCLOAK_POC_BFF_URL:-http://localhost:18091}
      KEYCLOAK_POC_WEB_CLIENT_SECRET: ${KEYCLOAK_POC_WEB_CLIENT_SECRET:?Run Initialize-LocalEnv.ps1 first}
      KEYCLOAK_POC_TASK_CLIENT_SECRET: ${KEYCLOAK_POC_TASK_CLIENT_SECRET:?Run Initialize-LocalEnv.ps1 first}
      KEYCLOAK_POC_USER_PASSWORD: ${KEYCLOAK_POC_USER_PASSWORD:?Run Initialize-LocalEnv.ps1 first}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${KEYCLOAK_HTTP_PORT:-18090}:8080"
    volumes:
      - ./realm/agent-doc-workbench-p0-realm.json:/opt/keycloak/data/import/agent-doc-workbench-p0-realm.json:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000
          printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3
          read -r status <&3
          [[ "$$status" == *" 200 "* ]]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 60s

volumes:
  postgres-data:
