# 任务服务 task‑service 应用配置

# 服务端口，环境变量 TASK_SERVICE_PORT，默认8083
server:
  port: ${TASK_SERVICE_PORT:8083}

spring:
  application:
    # 服务名称，用于注册中心、日志、Ping探活接口
    name: task-service
  # MySQL连接配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:agent_doc_workbench}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        default-requeue-rejected: false
  # Jackson JSON序列化全局时区，统一东八区，解决日期时间序列化时差问题
  jackson:
    time-zone: Asia/Shanghai
  ai:
    mcp:
      server:
        name: agent-doc-workbench
        version: 0.1.0
        protocol: STREAMABLE

# 自定义openapi配置
agent-doc:
  security:
    # Base64 编码的 16/24/32 字节 AES 密钥，生产环境必须通过环境变量注入
    task-capability-key: ${TASK_CAPABILITY_KEY:}
    # 模型 B：从 auth-service JWK Set 拉取 RSA 公钥，供 Spring Security Resource Server
    # 从 Authorization 自行解析 JWT 身份（配置即启用；无效 token 由 Security 层直接 401）
    jwks-url: ${AUTH_JWKS_URL:http://localhost:8081/oauth2/jwks}
    task-capability-filter-enabled: true
    capability-auth-endpoints:
      - /mcp
      - /mcp/**
      - /a2a
      - /a2a/**
  openapi:
    title: Task Service API
    description: 任务服务：Agent 任务、变更审批、Token 用量与审计
  feign:
    # 服务间调用统一经网关（复用 JWT 门禁并透传原始 Authorization，身份可追溯）
    gateway-url: ${GATEWAY_URL:http://localhost:9090}
  a2a:
    agent-service-url: ${AGENT_SERVICE_URL:http://localhost:8084}
    task-callback-url: ${TASK_CALLBACK_URL:http://localhost:8083/api/task/internal/a2a/events}
    mcp-server-url: ${MCP_SERVER_URL:http://localhost:8083/mcp}
    paths:
      send: /a2a/message:send
      task: /a2a/tasks/{taskId}
      cancel: /a2a/tasks/{taskId}:cancel
    reconcile-delay-ms: ${A2A_RECONCILE_DELAY_MS:60000}
    reconcile-stale-seconds: ${A2A_RECONCILE_STALE_SECONDS:120}
    reconcile-batch-size: ${A2A_RECONCILE_BATCH_SIZE:50}

# Spring Boot Actuator 健康检查端点配置
management:
  endpoints:
    web:
      exposure:
        # 对外暴露健康、信息端点，供k8s/gateway做服务探活
        include: health,info
  endpoint:
    health:
      # 健康接口不返回详细组件详情，只返回UP/DOWN，保护内部信息
      show-details: never

# SpringDoc OpenAPI Swagger文档路径配置
springdoc:
  swagger-ui:
    # Swagger UI访问页面路径
    path: /swagger-ui.html
  api-docs:
    # OpenAPI JSON元数据接口路径
    path: /v3/api-docs
