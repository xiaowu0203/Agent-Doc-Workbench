spring:
  datasource:
    url: jdbc:h2:mem:auth_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

auth:
  jwt:
    private-key:
    public-key:
    access-ttl: 30m
    refresh-ttl: 7d
    issuer: test

management:
  health:
    # 测试环境不提供 Redis，但 /actuator/health 默认会探测 Redis 连接；
    # 探测失败会把聚合状态置为 DOWN 并返回 503，使 SecurityIntegrationTest
    # 依赖"本机恰好有 Redis"这一环境条件。关闭该健康项，让测试自洽。
    redis:
      enabled: false
